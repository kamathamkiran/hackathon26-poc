<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520">
  <style>
    .box { fill: #f4f7fb; stroke: #23415f; stroke-width: 2; rx: 10; }
    .external { fill: #fff4df; stroke: #9a6414; stroke-width: 2; rx: 10; }
    .app { fill: #e9f5ee; stroke: #28734a; stroke-width: 2; rx: 10; }
    .text { font: 18px Arial, sans-serif; fill: #17212b; text-anchor: middle; }
    .small { font: 15px Arial, sans-serif; fill: #17212b; text-anchor: middle; }
    .title { font: bold 18px Arial, sans-serif; fill: #ffffff; text-anchor: middle; }
    .footer { font: 18px Arial, sans-serif; fill: #ffffff; text-anchor: middle; }
    .arrow { stroke: #425466; stroke-width: 2.5; marker-end: url(#arrow); }
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L10,3 L0,6 Z" fill="#425466"/>
    </marker>
  </defs>
  <text x="600" y="34" class="title">Credit Agreement AI Event Flow</text>

  <rect x="35" y="80" width="170" height="82" class="external"/>
  <text x="120" y="115" class="text">External UI</text>
  <text x="120" y="141" class="small">uploads PDF</text>

  <rect x="260" y="80" width="190" height="82" class="app"/>
  <text x="355" y="115" class="text">Spring Boot</text>
  <text x="355" y="141" class="small">/workflow/upload</text>

  <rect x="505" y="80" width="180" height="82" class="external"/>
  <text x="595" y="115" class="text">GCS bucket</text>
  <text x="595" y="141" class="small">stores PDF + metadata</text>

  <rect x="740" y="80" width="190" height="82" class="external"/>
  <text x="835" y="115" class="text">GCS notification</text>
  <text x="835" y="141" class="small">publishes event</text>

  <rect x="985" y="80" width="180" height="82" class="external"/>
  <text x="1075" y="115" class="text">Pub/Sub</text>
  <text x="1075" y="141" class="small">subscription</text>

  <line x1="205" y1="121" x2="260" y2="121" class="arrow"/>
  <line x1="450" y1="121" x2="505" y2="121" class="arrow"/>
  <line x1="685" y1="121" x2="740" y2="121" class="arrow"/>
  <line x1="930" y1="121" x2="985" y2="121" class="arrow"/>

  <rect x="260" y="265" width="190" height="82" class="app"/>
  <text x="355" y="300" class="text">AgreementSubscriber</text>
  <text x="355" y="326" class="small">creates workflow row</text>

  <rect x="505" y="265" width="180" height="82" class="app"/>
  <text x="595" y="300" class="text">WorkflowEngine</text>
  <text x="595" y="326" class="small">runs pipeline</text>

  <rect x="740" y="265" width="190" height="82" class="app"/>
  <text x="835" y="300" class="text">AI processing</text>
  <text x="835" y="326" class="small">parse, extract, validate, review</text>

  <rect x="985" y="265" width="180" height="82" class="app"/>
  <text x="1075" y="300" class="text">Workflow table</text>
  <text x="1075" y="326" class="small">latest stage/result</text>

  <line x1="1075" y1="162" x2="355" y2="265" class="arrow"/>
  <line x1="450" y1="306" x2="505" y2="306" class="arrow"/>
  <line x1="685" y1="306" x2="740" y2="306" class="arrow"/>
  <line x1="930" y1="306" x2="985" y2="306" class="arrow"/>

  <line x1="1075" y1="347" x2="600" y2="432" class="arrow"/>
  <text x="600" y="468" class="footer">External UI polls the workflow table for the latest status and deal data</text>
</svg>
